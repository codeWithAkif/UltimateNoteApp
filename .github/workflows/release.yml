name: Build and Release Ultimate NoteFactory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Cache Electron Binaries & Builder Tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-v1-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-v1-

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Vite App & Publish Electron Package to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          npm run build
          Compress-Archive -Path dist/* -DestinationPath dist.zip -Force
          npx electron-builder --win nsis --publish always || npx electron-builder --win nsis --publish always

      - name: Upload Mobile Web Bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Web Bundle & Sync Android
        run: |
          cd desktop
          npm run build
          npx cap sync android

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > desktop/android/app/release.keystore

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd desktop/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK for Release
        run: |
          cp desktop/android/app/build/outputs/apk/release/app-release.apk desktop/Ultimate-NoteFactory.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/Ultimate-NoteFactory.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
